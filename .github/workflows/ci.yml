---

name: CI

on:
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  Build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: 8.1 # This PHP version matches the server.
          tools: composer

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22 # This Node version matches the server.

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
